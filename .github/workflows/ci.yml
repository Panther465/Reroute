name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Reroute API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: reroute
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reroute
      EXAMPLES_DIR: ${{ github.workspace }}/examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests migrations && ruff format --check app tests migrations
      - name: Tests (planner, golden test, API flow) with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: OpenAPI file matches the code
        run: |
          python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2, ensure_ascii=False))" > /tmp/reroute.openapi.json
          diff -q /tmp/reroute.openapi.json ../shared/contracts/reroute.openapi.json

  raasta:
    name: Raasta API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: raasta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: raasta
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/raasta_test
      EXAMPLES_DIR: ${{ github.workspace }}/examples/bengaluru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: raasta/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  stack:
    name: Full stack, Postman and accessibility
    runs-on: ubuntu-latest
    needs: [backend, raasta, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start everything with one command
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Postman collection (Newman)
        run: npx --yes newman@6 run postman/reroute.postman_collection.json --insecure --reporters cli
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright with axe
        working-directory: frontend
        env:
          E2E_BASE_URL: https://localhost
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - run: docker compose down -v
        if: always()
