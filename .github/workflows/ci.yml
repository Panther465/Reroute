name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Reroute API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: reroute
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reroute
      EXAMPLES_DIR: ${{ github.workspace }}/examples
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests migrations && ruff format --check app tests migrations
      - name: Tests (planner, golden test, API flow) with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: OpenAPI file matches the code
        # Written the way shared/contracts/ is generated: UTF-8, LF line endings, a final newline.
        env:
          APP_ENV: test
        run: |
          python -c "import json; from pathlib import Path; from app.main import app; Path('/tmp/reroute.openapi.json').write_text(json.dumps(app.openapi(), indent=2, ensure_ascii=False) + chr(10), encoding='utf-8', newline=chr(10))"
          diff -u ../shared/contracts/reroute.openapi.json /tmp/reroute.openapi.json

  raasta:
    name: Raasta API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: raasta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: raasta
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/raasta_test
      EXAMPLES_DIR: ${{ github.workspace }}/examples/bengaluru
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: raasta/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests && ruff format --check app tests
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: OpenAPI file matches the code
        # Generated the same way as Reroute's: UTF-8, LF line endings, a final newline.
        env:
          APP_ENV: test
        run: |
          python -c "import json; from pathlib import Path; from app.main import app; Path('/tmp/raasta.openapi.json').write_text(json.dumps(app.openapi(), indent=2, ensure_ascii=False) + chr(10), encoding='utf-8', newline=chr(10))"
          diff -u ../shared/contracts/raasta.openapi.json /tmp/raasta.openapi.json

  frontend:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  stack:
    name: Full stack, Postman and accessibility
    runs-on: ubuntu-latest
    needs: [backend, raasta, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Start everything with one command
        # Every browser test signs in as the one demo user from one IP, so the per-user and sign-in
        # limits are raised for this run only.
        # The AI helper is off by default (UI brief 7.18); it is on here so the describe-your-day flows are
        # tested too (the pattern parser, with no Gemini key). With it off those two tests skip.
        env:
          AUTH_RATE_LIMIT_PER_MINUTE: "1000"
          RATE_LIMIT_PER_MINUTE: "1000"
          AI_HELPER_ENABLED: "true"
          # The demo account is off by default; Postman and the browser tests drive the demo day.
          DEMO_LOGIN: "true"
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Postman collection (Newman)
        run: npx --yes newman@6 run postman/reroute.postman_collection.json --insecure --reporters cli
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright with axe
        working-directory: frontend
        env:
          E2E_BASE_URL: https://localhost
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Keep the browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - run: docker compose down -v
        if: always()
