server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Files are gzipped at build time (gzip_static); anything else is compressed on the fly.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

  # Module scripts (MapLibre's worker) must be served as JavaScript: browsers refuse a module with
  # any other type, and the stock mime.types doesn't map .mjs.
  location ~* ^/assets/.+\.mjs$ {
    types { }
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Hashed assets never change: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker and the page shell must always be fresh.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  # Single-page app: every other path is the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
