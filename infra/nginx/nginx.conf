worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 1m;

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time "$http_x_request_id"';
  access_log /var/log/nginx/access.log main;

  # Two copies of the Reroute API, load balanced.
  upstream reroute_api {
    least_conn;
    server api-1:8000 max_fails=3 fail_timeout=10s;
    server api-2:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }
  upstream raasta_api { server raasta:8001; keepalive 16; }
  upstream web { server web:80; }

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # One origin for the app and both APIs: cookies stay first-party and CORS stays closed.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org https://fonts.googleapis.com https://fonts.gstatic.com https://accounts.google.com; worker-src 'self' blob:; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live updates: never buffer the event stream.
    location ~ ^/v1/trips/[^/]+/live$ {
      proxy_pass http://reroute_api;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
    }

    location /v1/raasta/ {
      client_max_body_size 2m; # recorded GPS rides
      proxy_pass http://raasta_api;
    }

    location /v1/ {
      proxy_pass http://reroute_api;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
