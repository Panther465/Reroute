worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 1m;

  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

  # The access log never holds a query string (place searches and read-aloud text travel there) or a
  # share token (a secret: the database keeps only its hash), in the app's /shared/ or the API's /v1/shared/.
  map $request_uri $log_uri {
    ~^(?<shared>/v1/shared/|/shared/)[^/?]+(?<rest>[^?]*)  "${shared}***${rest}";
    ~^(?<path>[^?]*)                                       $path;
  }
  log_format main '$remote_addr "$request_method $log_uri $server_protocol" $status $body_bytes_sent $request_time "$req_id"';
  access_log /var/log/nginx/access.log main;

  # Docker's DNS, re-read every 10 s: a rebuilt container gets a new address, and `resolve` finds it
  # without restarting NGINX (otherwise rebuilding one service leaves 502 Bad Gateway until a restart).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Two copies of the Reroute API, load balanced.
  upstream reroute_api {
    zone reroute_api 64k;
    least_conn;
    server api-1:8000 max_fails=3 fail_timeout=10s resolve;
    server api-2:8000 max_fails=3 fail_timeout=10s resolve;
    keepalive 32;
  }
  upstream raasta_api { zone raasta_api 64k; server raasta:8001 resolve; keepalive 16; }
  upstream web { zone web 64k; server web:80 resolve; }

  # Compress API responses; the web container serves its own pre-compressed files.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/problem+json text/plain text/csv;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # One origin for the app and both APIs: cookies stay first-party and CORS stays closed.
    # A location with its own add_header drops all of these, so the docs locations below repeat them.
    # media-src blob: lets Roo's read-aloud clips play (the app plays them from blob: URLs).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; media-src 'self' blob:; connect-src 'self' https://tiles.openfreemap.org https://accounts.google.com; worker-src 'self' blob:; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live updates: never buffer the event stream. (No add_header here: it would drop the security
    # headers above, and proxy_buffering off is all NGINX needs.)
    location ~ ^/v1/trips/[^/]+/live$ {
      proxy_pass http://reroute_api;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      gzip off; # compression would buffer the event stream
    }

    # Swagger UI loads its script and styles from cdn.jsdelivr.net and starts with an inline script,
    # which the app's policy blocks (the pages rendered blank). These two pages get their own policy
    # and repeat the other headers.
    location = /v1/docs {
      proxy_pass http://reroute_api;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location = /v1/raasta/docs {
      proxy_pass http://raasta_api;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location /v1/raasta/ {
      client_max_body_size 2m; # recorded GPS rides
      proxy_pass http://raasta_api;
    }

    location /v1/ {
      proxy_pass http://reroute_api;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
